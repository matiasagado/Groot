<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>Log In</title>
		<link rel="stylesheet" href="./static/login-styles.css" />
	</head>
	<body>
		<header>
			<h2 class="logo">LogParse AI</h2>
			<nav class="navigation">
				<button class="log-in-button" aria-label="Login">Login</button>
			</nav>
		</header>
		<div class="container">
			<span class="icon-close" aria-label="Close">
				<ion-icon name="close"></ion-icon>
			</span>
			<div class="form-box login">
				<h2>Login</h2>
				<form id="login-form" method="post">
					<div class="input-box">
						<span class="icon">
							<ion-icon name="mail"></ion-icon>
						</span>
						<input
							type="email"
							required
							id="email"
							aria-label="Email"
						/>
						<label for="email">Email</label>
					</div>
					<div class="input-box">
						<span class="icon">
							<ion-icon name="lock-closed"></ion-icon>
						</span>
						<input
							type="password"
							required
							id="password"
							aria-label="Password"
						/>
						<label for="password">Password</label>
					</div>
					<div
						id="password-error-login"
						class="error-message"
						aria-live="polite"
					></div>
					<div class="remember-forgot">
						<label><input type="checkbox" />Remember Me</label>
						<a href="#">Forgot Password?</a>
					</div>
					<button type="submit" class="btn">Login</button>
					<div class="login-register">
						<p>
							Don't have an account?<a
								href="#"
								class="register-link"
								>&nbsp;Register</a
							>
						</p>
					</div>
				</form>
			</div>
			<div class="form-box register">
				<h2>Register</h2>
				<form id="register-form" method="post" action="/register">
					<div class="input-box">
						<span class="icon">
							<ion-icon name="person"></ion-icon>
						</span>
						<input
							type="text"
							required
							id="username"
							aria-label="Username"
						/>
						<label for="username">Username</label>
					</div>
					<div class="input-box">
						<span class="icon">
							<ion-icon name="mail"></ion-icon>
						</span>
						<input
							type="email"
							required
							id="register-email"
							aria-label="Email"
						/>
						<label for="register-email">Email</label>
					</div>
					<div class="input-box">
						<span class="icon">
							<ion-icon name="lock-closed"></ion-icon>
						</span>
						<input
							type="password"
							required
							id="register-password"
							aria-label="Password"
						/>
						<label for="register-password">Password</label>
					</div>
					<div
						id="password-error-register"
						class="error-message"
						aria-live="polite"
					></div>
					<div class="remember-forgot">
						<label>
							<input type="checkbox" />I agree to the
							Terms&nbsp;&amp;&nbsp;Conditions
						</label>
					</div>
					<button type="submit" class="btn">Register</button>
					<div class="login-register">
						<p>
							Already have an account?<a
								href="#"
								class="login-link"
								>&nbsp;Login</a
							>
						</p>
					</div>
				</form>
			</div>
		</div>
		<script src="script.js"></script>
		<script
			type="module"
			src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
		></script>
		<script
			nomodule
			src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
		></script>
	</body>
</html>
