<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Groot — Sign in</title>
		<link rel="stylesheet" href="./static/login-styles.css?v=3" />
		<script src="https://unpkg.com/htmx.org@1.9.10"></script>
	</head>
	<body>
		<main class="auth-shell">
			<div class="auth-card">
				<header class="auth-brand">
					<h1 class="wordmark">Groot</h1>
					<p class="tagline">AI log analysis</p>
				</header>

				<nav class="auth-tabs" role="tablist">
					<button
						type="button"
						class="auth-tab is-active"
						data-form="login"
						role="tab"
						aria-selected="true"
					>
						Sign in
					</button>
					<button
						type="button"
						class="auth-tab"
						data-form="register"
						role="tab"
						aria-selected="false"
					>
						Create account
					</button>
				</nav>

				<form
					id="login-form"
					class="auth-form"
					method="post"
					hx-post="/login"
					hx-target="#login-form"
				>
					<label class="auth-field">
						<span class="auth-label">Email</span>
						<input
							type="email"
							name="email"
							autocomplete="email"
							required
						/>
					</label>
					<label class="auth-field">
						<span class="auth-label">Password</span>
						<div class="input-wrap">
							<button
								type="button"
								class="visibility-toggle"
								aria-label="Show password"
								data-target="login-password"
							>
								<svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
								<svg class="icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
							</button>
							<input
								id="login-password"
								type="password"
								name="password"
								autocomplete="current-password"
								required
							/>
						</div>
					</label>
					<div
						id="password-error-login"
						class="error-message"
						aria-live="polite"
					></div>
					<button type="submit" class="auth-submit">Sign in</button>
				</form>

				<form
					id="register-form"
					class="auth-form is-hidden"
					method="post"
					hx-post="/register"
					hx-target="#register-form"
				>
					<label class="auth-field">
						<span class="auth-label">Username</span>
						<input
							type="text"
							name="username"
							autocomplete="username"
							required
						/>
					</label>
					<label class="auth-field">
						<span class="auth-label">Email</span>
						<input
							type="email"
							name="register-email"
							autocomplete="email"
							required
						/>
					</label>
					<label class="auth-field">
						<span class="auth-label">Password</span>
						<div class="input-wrap">
							<button
								type="button"
								class="visibility-toggle"
								aria-label="Show password"
								data-target="register-password"
							>
								<svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
								<svg class="icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
							</button>
							<input
								id="register-password"
								type="password"
								name="register-password"
								autocomplete="new-password"
								required
							/>
						</div>
					</label>
					<ul class="password-rules" id="password-rules" hidden>
						<li class="rule" data-rule="length">
							<span class="rule-icon" aria-hidden="true">○</span>
							At least 8 characters
						</li>
						<li class="rule" data-rule="upper">
							<span class="rule-icon" aria-hidden="true">○</span>
							Uppercase letter
						</li>
						<li class="rule" data-rule="lower">
							<span class="rule-icon" aria-hidden="true">○</span>
							Lowercase letter
						</li>
						<li class="rule" data-rule="number">
							<span class="rule-icon" aria-hidden="true">○</span>
							Number
						</li>
						<li class="rule" data-rule="special">
							<span class="rule-icon" aria-hidden="true">○</span>
							Special character
						</li>
					</ul>
					<div
						id="password-error-register"
						class="error-message"
						aria-live="polite"
					></div>
					<button type="submit" class="auth-submit">
						Create account
					</button>
				</form>
			</div>
		</main>
		<script src="./script.js?v=2"></script>
	</body>
</html>
