<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>Log In</title>
		<link rel="stylesheet" href="./static/login-styles.css" />
		<script src="https://unpkg.com/htmx.org@1.8.4"></script>
		<!-- Add htmx script -->
	</head>
	<body>
		<header>
			<h2 class="logo">LogParse AI</h2>
			<nav class="navigation">
				<button
					class="log-in-button"
					aria-label="Login"
					hx-get="#login-form"
					hx-target=".container"
				>
					Login
				</button>
			</nav>
		</header>
		<div class="container">
			<span
				class="icon-close"
				aria-label="Close"
				hx-get="#close-popup"
				hx-target=".container"
			>
				<ion-icon name="close"></ion-icon>
			</span>
			<div
				class="form-box login"
				hx-get="#login-form"
				hx-target=".container"
			>
				<h2>Login</h2>
				<form
					id="login-form"
					method="post"
					hx-post="/login"
					hx-target="#login-form"
				>
					<div class="input-box">
						<span class="icon">
							<ion-icon name="mail"></ion-icon>
						</span>
						<input
							type="email"
							required
							id="email"
							aria-label="Email"
							name="email"
						/>
						<label for="email">Email</label>
					</div>
					<div class="input-box">
						<span class="icon">
							<ion-icon name="lock-closed"></ion-icon>
						</span>
						<input
							type="password"
							required
							id="password"
							aria-label="Password"
							name="password"
						/>
						<label for="password">Password</label>
					</div>
					<div
						id="password-error-login"
						class="error-message"
						aria-live="polite"
					></div>
					<div class="remember-forgot">
						<label><input type="checkbox" />Remember Me</label>
						<a href="#">Forgot Password?</a>
					</div>
					<button type="submit" class="btn">Login</button>
					<div class="login-register">
						<p>
							Don't have an account?<a
								href="#"
								class="register-link"
								hx-get="#register-form"
								hx-target=".container"
								>&nbsp;Register</a
							>
						</p>
					</div>
				</form>
			</div>
			<div
				class="form-box register"
				hx-get="#register-form"
				hx-target=".container"
			>
				<h2>Register</h2>
				<form
					id="register-form"
					method="post"
					action="/register"
					hx-post="/register"
					hx-target="#register-form"
				>
					<div class="input-box">
						<span class="icon">
							<ion-icon name="person"></ion-icon>
						</span>
						<input
							type="text"
							required
							id="username"
							aria-label="Username"
							name="username"
						/>
						<label for="username">Username</label>
					</div>
					<div class="input-box">
						<span class="icon">
							<ion-icon name="mail"></ion-icon>
						</span>
						<input
							type="email"
							required
							id="register-email"
							aria-label="Email"
							name="register-email"
						/>
						<label for="register-email">Email</label>
					</div>
					<div class="input-box">
						<span class="icon">
							<ion-icon name="lock-closed"></ion-icon>
						</span>
						<input
							type="password"
							required
							id="register-password"
							aria-label="Password"
							name="register-password"
						/>
						<label for="register-password">Password</label>
					</div>
					<div
						id="password-error-register"
						class="error-message"
						aria-live="polite"
					></div>
					<div class="remember-forgot">
						<label>
							<input type="checkbox" />I agree to the
							Terms&nbsp;&amp;&nbsp;Conditions
						</label>
					</div>
					<button type="submit" class="btn">Register</button>
					<div class="login-register">
						<p>
							Already have an account?<a
								href="#"
								class="login-link"
								hx-get="#login-form"
								hx-target=".container"
								>&nbsp;Login</a
							>
						</p>
					</div>
				</form>
			</div>
		</div>
		<script src="script.js"></script>
		<script
			type="module"
			src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
		></script>
		<script
			nomodule
			src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
		></script>
	</body>
</html>
