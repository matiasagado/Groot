<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Groot — Sign in</title>
		<link rel="stylesheet" href="./static/login-styles.css?v=3" />
		<script src="https://unpkg.com/htmx.org@1.9.10"></script>
	</head>
	<body>
		<main class="auth-shell">
			<div class="auth-card">
				<header class="auth-brand">
					<h1 class="wordmark">Groot</h1>
					<p class="tagline">AI log analysis</p>
				</header>

				<nav class="auth-tabs" role="tablist">
					<button
						type="button"
						class="auth-tab is-active"
						data-form="login"
						role="tab"
						aria-selected="true"
					>
						Sign in
					</button>
					<button
						type="button"
						class="auth-tab"
						data-form="register"
						role="tab"
						aria-selected="false"
					>
						Create account
					</button>
				</nav>

				<form
					id="login-form"
					class="auth-form"
					method="post"
					hx-post="/login"
					hx-target="#login-form"
				>
					<label class="auth-field">
						<span class="auth-label">Email</span>
						<input
							type="email"
							name="email"
							autocomplete="email"
							required
						/>
					</label>
					<label class="auth-field">
						<span class="auth-label">Password</span>
						<input
							type="password"
							name="password"
							autocomplete="current-password"
							required
						/>
					</label>
					<div
						id="password-error-login"
						class="error-message"
						aria-live="polite"
					></div>
					<button type="submit" class="auth-submit">Sign in</button>
				</form>

				<form
					id="register-form"
					class="auth-form is-hidden"
					method="post"
					hx-post="/register"
					hx-target="#register-form"
				>
					<label class="auth-field">
						<span class="auth-label">Username</span>
						<input
							type="text"
							name="username"
							autocomplete="username"
							required
						/>
					</label>
					<label class="auth-field">
						<span class="auth-label">Email</span>
						<input
							type="email"
							name="register-email"
							autocomplete="email"
							required
						/>
					</label>
					<label class="auth-field">
						<span class="auth-label">Password</span>
						<input
							type="password"
							name="register-password"
							autocomplete="new-password"
							required
						/>
					</label>
					<div
						id="password-error-register"
						class="error-message"
						aria-live="polite"
					></div>
					<button type="submit" class="auth-submit">
						Create account
					</button>
				</form>
			</div>
		</main>
		<script src="./script.js?v=2"></script>
	</body>
</html>
