<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Logs Dashboard</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="/static/styles.css" />
		<script src="https://unpkg.com/htmx.org@1.9.10"></script>
	</head>

	<body>
		<div class="logs-container">
			<h1 class="mt-3">Logs</h1>
			<div class="d-flex justify-content-between my-2">
				<form id="search-form" class="d-flex flex-grow-1">
					<input
						type="text"
						name="sql-filter"
						id="log-search"
						class="form-control me-2"
						placeholder="Enter an SQL query to filter the logs"
					/>
					<button
						type="submit"
						id="apply-filter"
						class="btn btn-secondary toolbar-toggle-button"
						hx-post="/filterLogs"
						hx-trigger="click"
						hx-target="#log-table-results"
						hx-swap="innerHTML"
					>
						Apply filter
					</button>
					<button
						type="button"
						id="clear-filter"
						class="btn btn-secondary toolbar-toggle-button"
					>
						Clear filter
					</button>
				</form>
				<button
					id="refresh"
					class="btn btn-secondary toolbar-toggle-button"
				>
					Refresh
				</button>
			</div>
			<div class="table-responsive">
				<table class="table">
					<thead class="table-light">
						<tr>
							<th>Timestamp</th>
							<th>Level</th>
							<th>Message</th>
							<th>Source</th>
						</tr>
					</thead>
					<tbody id="log-table-results">
						<tr>
							<td>Nothing here for now</td>
						</tr>
						<!-- Repeat <tr> for as many logs as you have -->
					</tbody>
				</table>
			</div>
		</div>
	</body>
</html>
