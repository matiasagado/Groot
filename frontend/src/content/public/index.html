<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <span class="top-bar-title">Logparse AI</span>
    <button class="logout-btn">Logout</button>
  </div>

  <!-- Logs Container -->
  <div class="logs-container">
    <h1 class="mt-3">System Logs</h1>
    <div class="controls">
      <button id="live-btn">Live</button>
      <button id="refresh-btn">Refresh</button>
      <div class="dropdown">
        <button id="sort-btn" class="dropdown-toggle" data-bs-toggle="dropdown">Sort</button>
        <ul class="dropdown-menu">
          <li><button class="dropdown-item">Timestamp</button></li>
          <li><button class="dropdown-item">Severity</button></li>
          <li><button class="dropdown-item">Source</button></li>
        </ul>
      </div>
      <div class="dropdown">
        <button id="filter-btn" class="dropdown-toggle" data-bs-toggle="dropdown">Filter</button>
        <div class="dropdown-menu">
          <input type="text" id="filter-input" placeholder="Enter SQL query for filtering" class="form-control" />
        </div>
      </div>
      <button id="clear-filters-btn">Clear Filter</button>
    </div>
    <div class="table-responsive">
      <table class="table">
        <thead class="table-light">
          <tr>
            <tr>
              <th>Timestamp</th>
              <th>Level</th>
              <th>Platform</th>
              <th>Original Message</th>
            </tr>
          </tr>
        </thead>
        <tbody id="log-table-results">
        </tbody>
      </table>
    </div>
  </div>


  <!-- WebSocket Script -->
  <script>
    // WebSocket connection
    console.log("Attempting to connect to WebSocket...");
	const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
	const ws = new WebSocket(wsProtocol + '//' + window.location.host + '/classifiedLogsWebSocket');
    const logsContainer = document.querySelector('.table-responsive tbody'); // Update to target the table body

    // On WebSocket connection open
    ws.onopen = function () {
      console.log('WebSocket connection established');
    };

      // On receiving a message
    ws.onmessage = function (event) {
      console.log('Received log from WebSocket:', event.data);
      const log = JSON.parse(event.data);

      // Create a new row for the log
      const logRow = document.createElement('tr');
      logRow.className = 'new-log-flash'; // Add animation class

      logRow.innerHTML = `
        <td>${log.dt}</td>
        <td>${log.level}</td>
        <td>${log.platform}</td>
        <td>${log.original_message}</td>
      `;

      // Insert the new row at the top of the logs table
      logsContainer.insertAdjacentElement('afterbegin', logRow);

      // Remove the animation class after it completes to allow future animations
      setTimeout(() => {
        logRow.classList.remove('new-log-flash');
      }, 1000);

      // Optional: Limit the number of visible logs and remove older ones
      const maxLogs = 10000; // Adjust as needed
      const logRows = logsContainer.querySelectorAll('tr');
      if (logRows.length > maxLogs) {
        logRows[logRows.length - 1].remove(); // Remove the oldest log
      }
    };

    // On WebSocket error
    ws.onerror = function (error) {
      console.error('WebSocket error:', error);
    };

    // On WebSocket close
    ws.onclose = function () {
      console.log('WebSocket connection closed');
    };

  </script>

</body>

</html>
