<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Groot — Logs</title>
		<link rel="stylesheet" href="/static/styles.css?v=2" />
	</head>
	<body>
		<div class="app">
			<aside class="sidebar">
				<div class="sidebar-brand">
					<h1 class="wordmark">Groot</h1>
					<p class="brand-tag">AI log analysis</p>
				</div>

				<nav class="sidebar-nav" aria-label="Primary">
					<span class="sidebar-section">Views</span>
					<a href="/index.html" class="sidebar-link is-active">
						<svg
							class="sidebar-icon"
							width="16"
							height="16"
							viewBox="0 0 16 16"
							fill="none"
							stroke="currentColor"
							stroke-width="1.5"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<line x1="3" y1="4" x2="13" y2="4" />
							<line x1="3" y1="8" x2="13" y2="8" />
							<line x1="3" y1="12" x2="9" y2="12" />
						</svg>
						Logs
					</a>
				</nav>

				<div class="sidebar-footer">
					<form action="/logout" method="post" class="sidebar-logout-form">
						<button class="sidebar-logout" type="submit">
							Sign out
						</button>
					</form>
				</div>
			</aside>

			<main class="main">
				<header class="main-header">
					<h2 class="page-title">Logs</h2>
					<div
						class="live-indicator is-active"
						id="live-indicator"
						role="button"
						aria-pressed="true"
					>
						<span class="live-dot"></span>
						<span class="live-label">Live</span>
					</div>
				</header>

				<section class="stats" aria-label="Summary">
					<article class="stat-card">
						<span class="stat-label">Total logs</span>
						<span class="stat-value" id="stat-total">—</span>
					</article>
					<article class="stat-card">
						<span class="stat-label">Errors</span>
						<span class="stat-value" id="stat-errors">—</span>
					</article>
					<article class="stat-card">
						<span class="stat-label">Last hour</span>
						<span class="stat-value" id="stat-recent">—</span>
					</article>
					<article class="stat-card">
						<span class="stat-label">AI classified</span>
						<span class="stat-value" id="stat-ai">—</span>
					</article>
				</section>

				<section class="filters" aria-label="Filters">
					<div class="filter-group">
						<span class="filter-label">Projects</span>
						<div class="chip-row" role="group">
							<button
								class="chip is-active"
								type="button"
								data-project="all"
							>
								All
							</button>
							<button
								class="chip"
								type="button"
								data-project="foothold"
							>
								foothold
							</button>
							<button
								class="chip"
								type="button"
								data-project="totem"
							>
								totem
							</button>
							<button
								class="chip"
								type="button"
								data-project="portfolio"
							>
								portfolio
							</button>
							<button
								class="chip"
								type="button"
								data-project="atlas"
							>
								atlas
							</button>
						</div>
					</div>

					<div class="filter-group">
						<span class="filter-label">Severity</span>
						<div class="chip-row" role="group">
							<button
								class="chip is-active"
								type="button"
								data-level="all"
							>
								All
							</button>
							<button
								class="chip"
								type="button"
								data-level="info"
							>
								Info
							</button>
							<button
								class="chip"
								type="button"
								data-level="warn"
							>
								Warn
							</button>
							<button
								class="chip"
								type="button"
								data-level="error"
							>
								Error
							</button>
						</div>
					</div>
				</section>

				<section class="search" aria-label="Search">
					<div class="search-input">
						<svg
							class="search-icon"
							width="14"
							height="14"
							viewBox="0 0 14 14"
							fill="none"
							stroke="currentColor"
							stroke-width="1.5"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<circle cx="6" cy="6" r="4.5" />
							<line x1="9.5" y1="9.5" x2="12.5" y2="12.5" />
						</svg>
						<input
							type="text"
							id="search"
							placeholder="Search logs..."
							autocomplete="off"
						/>
						<kbd class="kbd">⌘K</kbd>
					</div>
				</section>

				<section class="log-table" aria-label="Log table">
					<table>
						<thead>
							<tr>
								<th class="col-time">Time</th>
								<th class="col-project">Project</th>
								<th class="col-level">Level</th>
								<th class="col-ai">AI</th>
								<th class="col-msg">Message</th>
							</tr>
						</thead>
						<tbody id="log-rows">
							<tr class="log-row-empty">
								<td colspan="5">
									Waiting for logs from the pipeline…
								</td>
							</tr>
						</tbody>
					</table>
				</section>
			</main>
		</div>

		<script src="/static/dashboard.js?v=1"></script>
	</body>
</html>
