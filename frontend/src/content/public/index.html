<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>
  <!-- Header with aligned buttons -->
  <div class="header">
    <div class="left-group">
      <button id="live-btn" class="header-btn btn btn-secondary">Live</button>
      <button id="refresh-btn" class="header-btn btn btn-secondary">Refresh</button>
    </div>
    <div class="center-group">
      <div class="dropdown">
        <button id="sort-btn" class="header-btn btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">Sort</button>
        <ul class="dropdown-menu">
          <li>
            <button class="dropdown-item" hx-post="/sort" hx-vals='{"sort": "timestamp"}'
              hx-target="#log-table-results" hx-swap="innerHTML">Timestamp</button>
          </li>
          <li>
            <button class="dropdown-item" hx-post="/sort" hx-vals='{"sort": "severity"}'
              hx-target="#log-table-results" hx-swap="innerHTML">Severity</button>
          </li>
          <li>
            <button class="dropdown-item" hx-post="/sort" hx-vals='{"sort": "source"}'
              hx-target="#log-table-results" hx-swap="innerHTML">Source</button>
          </li>
        </ul>
      </div>
      <div class="dropdown">
        <button id="filter-btn" class="header-btn btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">Filter</button>
        <div class="dropdown-menu">
          <input type="text" id="filter-input" placeholder="Enter SQL query for filtering" class="form-control"
            hx-post="/applyFilter" hx-trigger="change" hx-target="#log-table-results" hx-swap="innerHTML" />
        </div>
      </div>
      <button id="clear-filters-btn" class="header-btn btn btn-secondary" hx-get="/clearFilters"
        hx-trigger="click" hx-target="#log-table-results" hx-swap="innerHTML">Clear Filter</button>
    </div>
    <div class="right-group">
      <button id="logout-btn" class="header-btn btn btn-danger">Logout</button>
    </div>
  </div>

  <!-- Logs Container -->
  <div class="logs-container">
    <h1 class="mt-3">Logs</h1>
    <div class="table-responsive">
      <table class="table">
        <thead class="table-light">
          <tr>
            <th>Timestamp</th>
            <th>Level</th>
            <th>Source</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="log-table-results">
        </tbody>
      </table>
    </div>
  </div>

  <!-- WebSocket Script -->
  <script>
  const ws = new WebSocket('ws://' + window.location.host + '/classifiedLogsWebSocket');
  const logsContainer = document.querySelector('.table-responsive');

  ws.onmessage = function(event) {
    const log = JSON.parse(event.data);
    const logRow = document.createElement('div');
    logRow.className = 'log-entry new-log-flash';

    logRow.innerHTML = `
      <span>${log.dt}</span>
      <span>${log.ai_classified_level}</span>
      <span>System</span>
      <span>${log.original_message}</span>
    `;

    logsContainer.appendChild(logRow);

    // Remove the animation class after it completes to allow future animations
    setTimeout(() => {
      logRow.classList.remove('new-log-flash');
    }, 1000);

    // Optional: Limit the number of visible logs and remove older ones
    const maxLogs = 10000;
    const logs = document.querySelectorAll('.log-entry');
    if (logs.length > maxLogs) {
      logs[0].remove();
    }

    // Auto-scroll to bottom
    logsContainer.scrollTop = logsContainer.scrollHeight;
  };

  ws.onerror = function(event) {
    console.error('WebSocket error:', event);
  };

  ws.onclose = function(event) {
    console.log('WebSocket connection closed:', event);
  };
  </script>

</body>

</html>
