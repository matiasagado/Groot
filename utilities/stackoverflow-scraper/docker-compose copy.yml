version: '3'

services:
  id-fetcher:
    build: ./id-fetcher/
    networks:
      - redis-net
  redis:
    image: redis:latest
    command: redis-server
    volumes:
      - redis-data:/var/lib/redis
      # - redis-config:/usr/local/etc/redis/redis.conf
    ports:
      - 6379:6379
    networks:
      - redis-net
