# docker-compose.yml
version: '3.8'

# TODO pass env variable for API token and key

services:
  id-fetcher:
    build: ./id-fetcher/
    container_name: id-fetcher
    env_file:
      - ./.env
    networks:
      - redis-network
  body-grabber:
    build: ./body-grabber/
    container_name: body-grabber
    env_file:
      - ./.env
    networks:
      - redis-network
  redis:
    image: redis/redis-stack
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - redis:/data
      # - ./redis-stack/redis-stack.conf:/redis-stack.conf
    networks:
      - redis-network
    env_file:
      - ./.env
    

  # redis:
