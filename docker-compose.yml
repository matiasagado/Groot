services:
  ai-core:
    container_name: poc-ai-core
    image: poc/ai-core:latest
    build: ./backend/ai-core
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OAI_TOKEN=aa
      - OAI_API_URL=http://bugatti.internal-headscale.ucaia.com:8920/v1/chat/completions

  log-preprocessor:
    container_name: poc-log-preprocessor
    image: poc/log-preprocessor:latest
    build: ./backend/log-preprocessor
    ports:
      - "9501:9501"
    environment:
      - SERVER_PORT=9501
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=test
      - CLICKHOUSE_PASS=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASS=
      - REDIS_DB=0
    depends_on:
      - clickhouse
      - redis

  mock-vector-client:
    container_name: poc-mock-vector-client
    image: poc/mock-vector-client:latest
    build: ./mock-vector-client
    environment:
      - HTTP_SINK_URI="http://poc-log-preprocessor:9501/test/http_sink"
    volumes:
      - ./backend/mock-vector-client/nginx-logs:/var/log/nginx
    restart: no
    depends_on:
      - log-preprocessor

  log-client:
    container_name: poc-log-client
    image: poc/log-client:latest
    build: ./log-client
    volumes:
      - ./logs/dmesg/50-line.log:/logs/log.log
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: no
    depends_on:
      - log-preprocessor
      - redis

  clickhouse:
    container_name: poc-clickhouse
    image: clickhouse/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=test
      - CLICKHOUSE_PASSWORD=password

  redis:
    container_name: poc-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./container-data/redis/data:/data
